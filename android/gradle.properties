org.gradle.jvmargs=-Xmx1536M -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=192m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
# 本机物理内存偏紧（8GB），构建时需为 Dart 内核编译器留出余量：
# 关闭并行构建与 worker 进程扇出，避免同时起多个 JVM 挤占内存。
org.gradle.parallel=false
org.gradle.workers.max=2
