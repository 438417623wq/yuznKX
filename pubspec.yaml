name: silly_tavern_flutter
description: A SillyTavern clone in Flutter.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_riverpod: ^2.4.0
  dio: ^5.4.0
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.0
  image_picker: ^1.2.1
  file_picker: ^10.3.10
  cached_network_image: ^3.3.0
  flutter_markdown: ^0.6.18
  uuid: ^4.2.0
  path_provider: ^2.1.0
  share_plus: ^12.0.1
  intl: ^0.20.2
  flutter_image_compress: ^2.4.0
  exif: ^3.3.0
  png_chunks_encode: ^1.0.0
  png_chunks_extract: ^1.0.2
  
  # Feature Dependencies
  flutter_tts: ^3.8.3
  speech_to_text: ^7.0.0
  flutter_animate: ^4.2.0
  google_fonts: ^6.1.0
  flutter_highlighter: ^0.1.1
  # llama_cpp_dart: ^0.2.2
  llama_cpp_dart:
    git:
      url: https://github.com/netdur/llama_cpp_dart.git
  webview_flutter: ^4.13.1
  flutter_colorpicker: ^1.1.0
  archive: ^4.0.7
      # ref: master # removed ref to use default branch

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
